{% load static %}
<details class="grc-language notranslate" data-language-switcher translate="no">
  <summary aria-label="Dil seç / Choose language"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5h14M5 17.5h14"/></svg><span data-language-code>TR</span><span class="grc-language-chevron" aria-hidden="true">⌄</span></summary>
  <div class="grc-language-panel">
    <span class="grc-language-heading">Dil / Language</span>
    <div class="grc-language-options">
      <button type="button" lang="tr" data-language="tr" aria-pressed="true"><span>Türkçe</span><small>TR</small></button>
      <button type="button" lang="en" data-language="en" aria-pressed="false"><span>English</span><small>EN</small></button>
      <button type="button" lang="fr" data-language="fr" aria-pressed="false"><span>Français</span><small>FR</small></button>
      <button type="button" lang="es" data-language="es" aria-pressed="false"><span>Español</span><small>ES</small></button>
      <button type="button" lang="ja" data-language="ja" aria-pressed="false"><span>日本語</span><small>JA</small></button>
      <button type="button" lang="zh-CN" data-language="zh-CN" aria-pressed="false"><span>简体中文</span><small>ZH</small></button>
      <button type="button" lang="vi" data-language="vi" aria-pressed="false"><span>Tiếng Việt</span><small>VI</small></button>
      <button type="button" lang="ar" data-language="ar" aria-pressed="false"><span dir="rtl">العربية</span><small>AR</small></button>
    </div>
    <span class="grc-language-note">Otomatik çeviri / Automatic translation</span>
    <span class="grc-language-status" role="status" aria-live="polite"></span>
  </div>
</details>
