# Separate Blueprint. Existing render.yaml and its services are unchanged.
databases:
  - name: municipal-console-db
    databaseName: municipal_console
    user: municipal_console
    region: frankfurt
    plan: 0.1c-256mb
services:
  - type: web
    name: municipal-console
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: municipal_console
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /signin/
    domains:
      - "*.grcustasi.com"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: municipal-console-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .grcustasi.com
      - key: CSRF_TRUSTED_ORIGINS
        value: ""
      - key: TENANT_BASE_DOMAIN
        value: grcustasi.com
      - key: GRCUSTASI_TELEGRAM_BOT_TOKEN
        sync: false
      - key: GRCUSTASI_TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
  - type: cron
    name: municipal-notification-retry
    runtime: python
    region: frankfurt
    rootDir: municipal_console
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_notifications
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        fromService:
          type: web
          name: municipal-console
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: municipal-console-db
          property: connectionString
      - key: GRCUSTASI_TELEGRAM_BOT_TOKEN
        fromService:
          type: web
          name: municipal-console
          envVarKey: GRCUSTASI_TELEGRAM_BOT_TOKEN
      - key: GRCUSTASI_TELEGRAM_ADMIN_CHAT_ID
        fromService:
          type: web
          name: municipal-console
          envVarKey: GRCUSTASI_TELEGRAM_ADMIN_CHAT_ID
      - key: EMAIL_HOST
        fromService:
          type: web
          name: municipal-console
          envVarKey: EMAIL_HOST
      - key: EMAIL_HOST_USER
        fromService:
          type: web
          name: municipal-console
          envVarKey: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
        fromService:
          type: web
          name: municipal-console
          envVarKey: EMAIL_HOST_PASSWORD
      - key: DEFAULT_FROM_EMAIL
        fromService:
          type: web
          name: municipal-console
          envVarKey: DEFAULT_FROM_EMAIL
      - key: EMAIL_PORT
        fromService:
          type: web
          name: municipal-console
          envVarKey: EMAIL_PORT
      - key: EMAIL_USE_TLS
        fromService:
          type: web
          name: municipal-console
          envVarKey: EMAIL_USE_TLS
      - key: EMAIL_USE_SSL
        fromService:
          type: web
          name: municipal-console
          envVarKey: EMAIL_USE_SSL
